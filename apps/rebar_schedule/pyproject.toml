[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rebar-schedule"
version = "0.1.0"
description = "Planillas de corte y doblado a partir de RFEM 6."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
excel = [
    "openpyxl>=3.1",
]
rfem = [
    "dlubal.api",
]

[project.scripts]
rebar-schedule = "rebar_schedule.cli.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
